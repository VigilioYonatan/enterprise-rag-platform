groups:
  - name: rag-api-slo
    interval: 30s
    rules:
      - alert: RagApiDown
        expr: up{job="rag-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Enterprise RAG API target unavailable'
          description: 'The Prometheus scrape target has been unhealthy for two minutes.'

      - alert: RagApiHighErrorRate
        expr: |
          sum(rate(rag_http_requests_total{outcome="server_error"}[5m]))
          /
          clamp_min(sum(rate(rag_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'API server error ratio above 5%'
          description: 'HTTP 5xx ratio exceeded 5% over a 10-minute window.'

      - alert: RagApiHighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(rag_http_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'API request p95 above two seconds'
          description: 'End-to-end request p95 latency exceeded 2s.'

      - alert: RagBudgetRejectionsSpike
        expr: sum(increase(rag_budget_rejections_total[15m])) > 10
        for: 5m
        labels:
          severity: info
        annotations:
          summary: 'Spike in tenant FinOps daily budget rejections'
          description: 'Multiple requests were blocked by atomic tenant FinOps quotas.'
