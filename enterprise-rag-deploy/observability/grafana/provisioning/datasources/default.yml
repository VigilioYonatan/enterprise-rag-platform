apiVersion: 1
datasources:
  - name: Prometheus
    uid: rag-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: rag-loki
    type: loki
    access: proxy
    url: http://loki:3100
