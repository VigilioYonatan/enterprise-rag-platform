# Vigilio Level 1 (compose-vps) Canonical Compose Manifest — Rootless Podman + RustFS
name: enterprise-rag

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg17}
    cpus: 2.0
    mem_limit: 2048m
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set application DB password}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set worker password}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set keycloak password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init/00_roles.sh:/docker-entrypoint-initdb.d/00_roles.sh:ro
    tmpfs:
      - /tmp:rw,nodev,nosuid,noexec,size=64m
      - /var/run/postgresql:rw,nodev,nosuid,size=16m
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rag']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    <<: *service-defaults
    profiles: ['development']
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.22}
    cpus: 0.25
    mem_limit: 128m
    ports:
      - '127.0.0.1:8025:8025'
    networks: [edge, backend]

  keycloak:
    <<: *service-defaults
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.5}
    cpus: 1.5
    mem_limit: 1536m
    command: ['${KEYCLOAK_START_MODE:-start-dev}', '--import-realm', '--health-enabled=true']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set keycloak db password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set keycloak admin password}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8081}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
    volumes:
      - ${KEYCLOAK_REALM_FILE:-../keycloak/realm-enterprise.json}:/opt/keycloak/data/import/realm-enterprise.json:ro
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, backend]
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && grep -q "200" <&3']
      interval: 15s
      timeout: 5s
      retries: 15

  # Private Apache-2.0 S3-compatible object storage (RustFS). Zero public ports.
  rustfs:
    <<: *service-defaults
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0-alpha.82}
    cpus: 1.0
    mem_limit: 512m
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set rustfs access key}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set rustfs secret key}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-false}
    volumes:
      - rustfs_data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  # Self-hosted Valkey: no public ports, password required and AOF enabled.
  valkey:
    <<: *service-defaults
    image: ${VALKEY_IMAGE:-valkey/valkey:8.1.11-alpine}
    cpus: 0.5
    mem_limit: 512m
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set valkey password}
    command: ['/bin/sh', '-ec', 'exec valkey-server --appendonly yes --requirepass "$$VALKEY_PASSWORD"']
    volumes:
      - valkey_data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12

  clamav:
    <<: *service-defaults
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    cpus: 1.0
    mem_limit: 1536m
    environment:
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-true}
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc 127.0.0.1 3310 | grep -q PONG']
      interval: 30s
      timeout: 15s
      retries: 20

  # One-shot SQL schema migration (invoked explicitly via --profile tools)
  migrate:
    profiles: ['tools']
    restart: 'no'
    image: ${RAG_API_IMAGE:-enterprise-rag-api:dev}
    build:
      context: ../../apps/enterprise-rag-impl
    command: ['dist/database/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres@postgres:5432/rag
      DATABASE_URL: postgresql://rag_app@postgres:5432/rag
      PGPASSWORD: ${POSTGRES_PASSWORD:?set migration password}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/enterprise}
      OIDC_JWKS_URL: http://keycloak:8080/realms/enterprise/protocol/openid-connect/certs
    read_only: true
    tmpfs: ['/tmp:rw,nodev,nosuid,noexec,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  # One-shot RustFS private bucket provisioning (invoked explicitly via --profile tools)
  platform-setup:
    profiles: ['tools']
    restart: 'no'
    image: ${RAG_API_IMAGE:-enterprise-rag-api:dev}
    build:
      context: ../../apps/enterprise-rag-impl
    command: ['dist/platform/setup.js']
    environment:
      DATABASE_URL: postgresql://rag_app@postgres:5432/rag
      PGPASSWORD: ${APP_DB_PASSWORD:?set application DB password}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/enterprise}
      OIDC_JWKS_URL: http://keycloak:8080/realms/enterprise/protocol/openid-connect/certs
      OBJECT_STORAGE_HOST: rustfs
      OBJECT_STORAGE_PORT: 9000
      OBJECT_STORAGE_SSL: 'false'
      OBJECT_STORAGE_BUCKET: rag-documents
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set rustfs access key}
      OBJECT_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set rustfs secret key}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set valkey password}
    read_only: true
    tmpfs: ['/tmp:rw,nodev,nosuid,noexec,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      rustfs:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *service-defaults
    image: ${RAG_API_IMAGE:-enterprise-rag-api:dev}
    build:
      context: ../../apps/enterprise-rag-impl
    cpus: 1.5
    mem_limit: 1024m
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://rag_app@postgres:5432/rag
      PGPASSWORD: ${APP_DB_PASSWORD:?set application DB password}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/enterprise}
      OIDC_JWKS_URL: http://keycloak:8080/realms/enterprise/protocol/openid-connect/certs
      OIDC_AUDIENCE: enterprise-rag-api
      OIDC_CLIENT_ID: enterprise-rag-web
      OLLAMA_URL: http://ollama:11434
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-qwen2.5:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      MIN_VECTOR_SIMILARITY: ${MIN_VECTOR_SIMILARITY:-0.25}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-0}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-0}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      OBJECT_STORAGE_HOST: rustfs
      OBJECT_STORAGE_PORT: 9000
      OBJECT_STORAGE_SSL: 'false'
      OBJECT_STORAGE_BUCKET: rag-documents
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set rustfs access key}
      OBJECT_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set rustfs secret key}
      VALKEY_URL: redis://valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set valkey password}
      QUEUE_MODE: bullmq
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: rag-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    read_only: true
    tmpfs: ['/tmp:rw,nodev,nosuid,noexec,size=32m']
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks: [backend, observability]
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', '-e', 'fetch("http://127.0.0.1:3000/api/v1/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 8s
      retries: 8

  outbox:
    <<: *service-defaults
    image: ${RAG_API_IMAGE:-enterprise-rag-api:dev}
    build:
      context: ../../apps/enterprise-rag-impl
    cpus: 0.5
    mem_limit: 384m
    command: ['--require', './dist/observability/tracing.js', 'dist/outbox/main.js']
    environment:
      DATABASE_URL: postgresql://rag_worker@postgres:5432/rag
      WORKER_DATABASE_URL: postgresql://rag_worker@postgres:5432/rag
      PGPASSWORD: ${WORKER_DB_PASSWORD:?set worker DB password}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/enterprise}
      OIDC_JWKS_URL: http://keycloak:8080/realms/enterprise/protocol/openid-connect/certs
      VALKEY_URL: redis://valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set valkey password}
      QUEUE_MODE: bullmq
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: rag-outbox
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    read_only: true
    tmpfs: ['/tmp:rw,nodev,nosuid,noexec,size=32m']
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [backend, observability]

  worker:
    <<: *service-defaults
    image: ${RAG_API_IMAGE:-enterprise-rag-api:dev}
    build:
      context: ../../apps/enterprise-rag-impl
    cpus: 1.5
    mem_limit: 1024m
    command: ['--require', './dist/observability/tracing.js', 'dist/worker/main.js']
    environment:
      DATABASE_URL: postgresql://rag_worker@postgres:5432/rag
      WORKER_DATABASE_URL: postgresql://rag_worker@postgres:5432/rag
      PGPASSWORD: ${WORKER_DB_PASSWORD:?set worker DB password}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/enterprise}
      OIDC_JWKS_URL: http://keycloak:8080/realms/enterprise/protocol/openid-connect/certs
      OLLAMA_URL: http://ollama:11434
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-qwen2.5:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-0}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-0}
      OBJECT_STORAGE_HOST: rustfs
      OBJECT_STORAGE_PORT: 9000
      OBJECT_STORAGE_SSL: 'false'
      OBJECT_STORAGE_BUCKET: rag-documents
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set rustfs access key}
      OBJECT_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set rustfs secret key}
      VALKEY_URL: redis://valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set valkey password}
      QUEUE_MODE: bullmq
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: rag-worker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      OCR_ENABLED: ${OCR_ENABLED:-false}
    read_only: true
    tmpfs: ['/tmp:rw,nodev,nosuid,noexec,size=64m']
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks: [backend, observability]

  web:
    <<: *service-defaults
    image: ${RAG_WEB_IMAGE:-enterprise-rag-web:dev}
    build:
      context: ../../apps/enterprise-rag-web
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:8081/realms/enterprise}
        VITE_GOOGLE_ENABLED: ${VITE_GOOGLE_ENABLED:-false}
        VITE_FACEBOOK_ENABLED: ${VITE_FACEBOOK_ENABLED:-false}
    cpus: 0.5
    mem_limit: 256m
    environment:
      RUNTIME_API_BASE: /api/v1
      RUNTIME_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:8081/realms/enterprise}
      RUNTIME_OIDC_CLIENT_ID: enterprise-rag-web
      RUNTIME_GOOGLE_ENABLED: ${VITE_GOOGLE_ENABLED:-false}
      RUNTIME_FACEBOOK_ENABLED: ${VITE_FACEBOOK_ENABLED:-false}
      CSP_CONNECT_ORIGIN: ${CSP_CONNECT_ORIGIN:-http://localhost:8081}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:rw,nodev,nosuid,noexec,size=16m']
    cap_drop: [ALL]
    networks: [edge, backend]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/config.js >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6

  caddy:
    <<: *service-defaults
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    cpus: 0.5
    mem_limit: 256m
    ports:
      - '${CADDY_BIND_HTTP:-127.0.0.1:8080}:8080'
      - '${CADDY_BIND_HTTPS:-127.0.0.1:8443}:8443'
    volumes:
      - ${CADDYFILE_PATH:-../caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      AUTH_SITE_ADDRESS: ${AUTH_SITE_ADDRESS:-auth.localhost}
      CSP_CONNECT_ORIGIN: ${CSP_CONNECT_ORIGIN:-http://localhost:8081}
    networks: [edge, backend]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/api/v1/health/live >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6

  ollama:
    <<: *service-defaults
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.12.10}
    profiles: ['llm']
    cpus: 4.0
    mem_limit: 8192m
    volumes:
      - ollama_data:/root/.ollama
    networks: [backend]

  prometheus:
    <<: *service-defaults
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    profiles: ['observability']
    cpus: 0.5
    mem_limit: 512m
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/rag-alerts.yml:/etc/prometheus/rag-alerts.yml:ro
      - prometheus_data:/prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus']
    depends_on: [api, alertmanager]
    networks: [observability]

  alertmanager:
    <<: *service-defaults
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    profiles: ['observability']
    cpus: 0.25
    mem_limit: 128m
    command: ['--config.file=/etc/alertmanager/alertmanager.yml', '--storage.path=/alertmanager']
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [observability]
    cap_drop: [ALL]

  loki:
    <<: *service-defaults
    image: ${LOKI_IMAGE:-grafana/loki:3.4.2}
    profiles: ['observability']
    cpus: 0.5
    mem_limit: 512m
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ../observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [observability]
    cap_drop: [ALL]

  alloy:
    <<: *service-defaults
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.7.5}
    profiles: ['observability']
    cpus: 0.25
    mem_limit: 256m
    command: ['run', '/etc/alloy/config.alloy', '--storage.path=/var/lib/alloy']
    volumes:
      - ../observability/alloy.river:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
    depends_on: [loki, tempo]
    networks: [observability]
    cap_drop: [ALL]

  otel-collector:
    <<: *service-defaults
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.128.0}
    profiles: ['observability']
    cpus: 0.5
    mem_limit: 256m
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [observability]
    cap_drop: [ALL]

  tempo:
    <<: *service-defaults
    image: ${TEMPO_IMAGE:-grafana/tempo:2.7.2}
    profiles: ['observability']
    cpus: 0.5
    mem_limit: 512m
    command: ['-config.file=/etc/tempo/config.yaml']
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks: [observability]
    cap_drop: [ALL]

  grafana:
    <<: *service-defaults
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    profiles: ['observability']
    cpus: 0.5
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set Grafana admin password for observability}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus, loki, tempo]
    networks: [observability, edge]

networks:
  edge:
    internal: false
  backend:
    internal: true
  observability:
    internal: true

volumes:
  postgres_data: {}
  ollama_data: {}
  rustfs_data: {}
  valkey_data: {}
  caddy_data: {}
  caddy_config: {}
  clamav_data: {}
  prometheus_data: {}
  alertmanager_data: {}
  loki_data: {}
  alloy_data: {}
  grafana_data: {}
  tempo_data: {}
