  rustfs_image: "rustfs/rustfs:1.0.0-alpha.82"
  keycloak_image: "quay.io/keycloak/keycloak:26.5"
  clamav_image: "clamav/clamav:1.4"
  caddy_image: "caddy:2-alpine"

# 4. Observability Profile Images (exact images declared in enterprise-rag-deploy/compose/compose.yaml)
