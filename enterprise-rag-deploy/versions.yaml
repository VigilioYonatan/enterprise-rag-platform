# Vigilio Level 1 (compose-vps) Deterministic Tool, Package & Runtime Catalog
# Governance: aligned with vigilio-docs/technology/versions.md (2026-10-25) and actual lockfiles/images.
# Never treat reference candidates as installed versions without lockfile + runtime verification.
schema_version: "1.1"
updated_at: "2026-11-07"
vigilio_docs_reference_date: "2026-10-25"
platform_profile: "compose-vps"
orchestrator_primary: "podman-compose"
orchestrator_fallback: "docker-compose"

# 1. Host & Build Runtimes (verified via node -v, pnpm -v, and Dockerfiles)
runtimes:
  nodejs_host_verified: "24.22.0"
  nodejs_vigilio_lts_reference: "24.22.1"
  nodejs_builder_image: "node:24-bookworm-slim"
  nodejs_distroless_image: "gcr.io/distroless/nodejs24-debian13:nonroot"
  pnpm_locked: "12.14.0"
  typescript_locked: "6.0.3"
  biome_locked: "2.6.3"

# 2. Application Packages Resolved in pnpm-lock.yaml (never claim NestJS 12 / Vitest 5 without migration gate)
packages_locked:
  nestjs_core: "11.1.6"
  nestjs_swagger: "11.2.0"
  nestjs_zod: "5.5.0"
  scalar_nestjs_api_reference: "1.2.35"
  zod: "4.6.7"
  drizzle_orm: "0.45.4"
  pg: "8.16.3"
  bullmq: "5.58.5"
  pino: "10.4.0"
  react: "19.2.0"
  tanstack_react_query: "5.90.5"
  react_hook_form: "7.65.0"
  tailwindcss: "4.3.5"
  vite: "8.3.5"
  vitest: "4.1.10"
  playwright_test: "1.64.1"
  cucumber: "11.3.0"

# 3. Container Data Plane (exact images declared in enterprise-rag-deploy/compose/compose.yaml)
data_plane:
