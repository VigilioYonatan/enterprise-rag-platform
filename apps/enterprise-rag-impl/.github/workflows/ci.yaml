name: Backend CI (Vigilio Node 24 + pnpm + OpenAPI gate)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: impl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Activate deterministic pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Supply-chain audit (production dependencies)
        run: pnpm audit --prod --audit-level=high
      - name: Biome lint & formatting gate
        run: pnpm run check
      - name: TypeScript strict check
        run: pnpm run typecheck
      - name: Unit & vertical service tests
        run: pnpm test
      - name: Build all 5 runtime entrypoints
        run: pnpm run build
      - name: Export & verify 100% OpenAPI 2xx contract
        run: pnpm run openapi:export && pnpm run openapi:diff
