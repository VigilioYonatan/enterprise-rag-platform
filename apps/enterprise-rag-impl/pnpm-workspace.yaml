packages:
  - .
  - packages/*

engineStrict: true
preferFrozenLockfile: true
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
minimumReleaseAge: 1440

allowBuilds:
  "@biomejs/biome": true
  "@nestjs/core": false
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  tesseract.js: false
