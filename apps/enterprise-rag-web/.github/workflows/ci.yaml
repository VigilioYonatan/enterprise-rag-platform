name: Frontend CI (Vigilio React 19 + pnpm + Contract Drift Gate)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Activate deterministic pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Supply-chain audit (production dependencies)
        run: pnpm audit --prod --audit-level=high
      - name: Verify generated OpenAPI contract
        run: pnpm run contracts:check
      - name: Biome lint, format & a11y gate
        run: pnpm run check
      - name: TypeScript strict check
        run: pnpm run typecheck
      - name: Vitest + React Testing Library suite
        run: pnpm test
      - name: Production bundle build
        run: pnpm run build
