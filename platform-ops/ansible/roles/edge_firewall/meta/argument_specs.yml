---
argument_specs:
  main:
    short_description: Configure nftables host firewall and 80/443 redirection to Rootless Podman ports
    options:
      firewall_ssh_port:
        type: int
        required: false
        default: 22
        description: Allowed inbound SSH management port.
      firewall_rootless_http_port:
        type: int
        required: false
        default: 8080
        description: Unprivileged HTTP port bound by Rootless Podman ingress proxy.
      firewall_rootless_https_port:
        type: int
        required: false
        default: 8443
        description: Unprivileged HTTPS port bound by Rootless Podman ingress proxy.
